[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scicodewiki"
version = "0.0.1"
description = "Verified scientific documentation layer for scientific computing repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "sympy",
    "pyyaml",
]

[project.optional-dependencies]
render = ["mkdocs", "mkdocs-material"]

[project.scripts]
scicodewiki = "scicodewiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
